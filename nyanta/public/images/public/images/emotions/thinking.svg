<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 顔の背景 -->
  <circle cx="60" cy="60" r="54" fill="#D5E8D4" stroke="#2D2D2D" stroke-width="3"/>
  <!-- ほっぺた -->
  <ellipse cx="28" cy="70" rx="12" ry="8" fill="#82B366" opacity="0.4"/>
  <ellipse cx="92" cy="70" rx="12" ry="8" fill="#82B366" opacity="0.4"/>
  <!-- 目（考え中の目・片目が細い） -->
  <ellipse cx="42" cy="52" rx="9" ry="7" fill="white" stroke="#2D2D2D" stroke-width="2.5"/>
  <circle cx="43" cy="53" r="4" fill="#2D2D2D"/>
  <ellipse cx="78" cy="54" rx="9" ry="4" fill="white" stroke="#2D2D2D" stroke-width="2.5"/>
  <circle cx="79" cy="54" r="2.5" fill="#2D2D2D"/>
  <!-- 口（むむむ） -->
  <path d="M42 80 Q60 76 78 80" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 眉（片方が上がってる） -->
  <path d="M32 38 Q42 32 52 38" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M68 40 Q78 36 88 38" stroke="#2D2D2D" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 手（あごに手をあてる） -->
  <path d="M78 88 Q88 82 90 70" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 考え中の泡 -->
  <circle cx="96" cy="28" r="4" fill="white" stroke="#2D2D2D" stroke-width="1.5"/>
  <circle cx="104" cy="18" r="6" fill="white" stroke="#2D2D2D" stroke-width="1.5"/>
  <circle cx="112" cy="8" r="8" fill="white" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="108" y="12" text-anchor="middle" font-size="9" font-weight="bold" fill="#2D2D2D">?</text>
</svg>
