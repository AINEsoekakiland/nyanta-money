<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 顔の背景 -->
  <circle cx="60" cy="60" r="54" fill="#FAD7A0" stroke="#2D2D2D" stroke-width="3"/>
  <!-- ほっぺた -->
  <ellipse cx="28" cy="72" rx="13" ry="9" fill="#E59866" opacity="0.5"/>
  <ellipse cx="92" cy="72" rx="13" ry="9" fill="#E59866" opacity="0.5"/>
  <!-- 目（困り目） -->
  <ellipse cx="42" cy="52" rx="9" ry="7" fill="white" stroke="#2D2D2D" stroke-width="2.5"/>
  <circle cx="42" cy="53" r="4" fill="#2D2D2D"/>
  <ellipse cx="78" cy="52" rx="9" ry="7" fill="white" stroke="#2D2D2D" stroke-width="2.5"/>
  <circle cx="78" cy="53" r="4" fill="#2D2D2D"/>
  <!-- 眉（困り眉） -->
  <path d="M32 36 Q38 42 50 38" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M70 38 Q82 42 88 36" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 口（への字口） -->
  <path d="M38 80 Q60 70 82 80" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 汗 -->
  <ellipse cx="92" cy="36" rx="5" ry="8" fill="#AED6F1" stroke="#3498DB" stroke-width="1.5" transform="rotate(-15 92 36)"/>
  <!-- 縦線（困ってる） -->
  <line x1="60" y1="12" x2="60" y2="24" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="14" x2="56" y2="26" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
  <line x1="66" y1="14" x2="64" y2="26" stroke="#2D2D2D" stroke-width="2" stroke-linecap="round"/>
</svg>
