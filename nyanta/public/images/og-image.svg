<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#FFD166"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="120" fill="white" opacity="0.08"/>
  <circle cx="1150" cy="560" r="160" fill="white" opacity="0.08"/>
  <circle cx="1100" cy="80" r="80" fill="white" opacity="0.1"/>
  <!-- Main card -->
  <rect x="80" y="80" width="1040" height="470" rx="40" fill="white" opacity="0.15"/>
  <!-- Emoji characters -->
  <text x="200" y="380" font-size="200">🐱</text>
  <text x="420" y="340" font-size="130">👦</text>
  <text x="580" y="360" font-size="150">👨‍🔬</text>
  <!-- Title -->
  <text x="860" y="250" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="900" fill="white">にゃんたと学ぶ</text>
  <text x="860" y="340" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="900" fill="#2D2D2D">お金のヒミツ</text>
  <!-- Subtitle -->
  <rect x="620" y="380" width="480" height="60" rx="30" fill="white" opacity="0.3"/>
  <text x="860" y="420" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">子ども向け教育アニメ 公式サイト</text>
  <!-- Coins decoration -->
  <circle cx="720" cy="540" r="25" fill="#FFD166" stroke="white" stroke-width="3"/>
  <text x="720" y="548" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2D2D2D">¥</text>
  <circle cx="790" cy="545" r="20" fill="#FFD166" stroke="white" stroke-width="3"/>
  <text x="790" y="552" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D2D2D">¥</text>
  <circle cx="850" cy="540" r="25" fill="#FFD166" stroke="white" stroke-width="3"/>
  <text x="850" y="548" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2D2D2D">¥</text>
</svg>
