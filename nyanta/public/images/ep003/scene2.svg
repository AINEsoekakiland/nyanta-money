<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#FFFDE7"/>
  <rect x="0" y="290" width="640" height="70" fill="#FFF9C4"/>
  <!-- Job icons circle layout -->
  <circle cx="320" cy="170" r="110" fill="none" stroke="#FFD166" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Center: Money / work symbol -->
  <circle cx="320" cy="170" r="45" fill="#FFD166" stroke="#2D2D2D" stroke-width="3"/>
  <text x="320" y="162" text-anchor="middle" font-size="28">💼</text>
  <text x="320" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2D2D2D">お仕事</text>
  <!-- Jobs around -->
  <circle cx="320" cy="55" r="34" fill="white" stroke="#FF6B35" stroke-width="2.5"/>
  <text x="320" y="50" text-anchor="middle" font-size="22">👨‍⚕️</text>
  <text x="320" y="76" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D2D2D">お医者さん</text>
  <circle cx="440" cy="100" r="34" fill="white" stroke="#06D6A0" stroke-width="2.5"/>
  <text x="440" y="95" text-anchor="middle" font-size="22">👩‍🍳</text>
  <text x="440" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D2D2D">コックさん</text>
  <circle cx="480" cy="230" r="34" fill="white" stroke="#845EC2" stroke-width="2.5"/>
  <text x="480" y="225" text-anchor="middle" font-size="22">👩‍🏫</text>
  <text x="480" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D2D2D">先生</text>
  <circle cx="200" cy="100" r="34" fill="white" stroke="#118AB2" stroke-width="2.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="22">🐟</text>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D2D2D">お魚屋さん</text>
  <circle cx="160" cy="230" r="34" fill="white" stroke="#FF6B35" stroke-width="2.5"/>
  <text x="160" y="225" text-anchor="middle" font-size="22">🚌</text>
  <text x="160" y="250" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2D2D2D">バス運転士</text>
  <!-- Arrows to center -->
  <line x1="320" y1="88" x2="320" y2="126" stroke="#FFD166" stroke-width="2"/>
  <line x1="408" y1="120" x2="358" y2="144" stroke="#06D6A0" stroke-width="2"/>
  <line x1="448" y1="213" x2="366" y2="192" stroke="#845EC2" stroke-width="2"/>
  <line x1="232" y1="120" x2="284" y2="144" stroke="#118AB2" stroke-width="2"/>
  <line x1="194" y1="213" x2="278" y2="190" stroke="#FF6B35" stroke-width="2"/>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#666">第3話：みんな誰かの役に立っている</text>
