<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#F3E5F5"/>
  <rect x="0" y="280" width="640" height="80" fill="#CE93D8" opacity="0.3"/>
  <!-- Salary envelope -->
  <rect x="230" y="100" width="180" height="130" rx="12" fill="white" stroke="#845EC2" stroke-width="3"/>
  <path d="M230,100 L320,165 L410,100" stroke="#845EC2" stroke-width="2.5" fill="none"/>
  <text x="320" y="180" text-anchor="middle" font-size="32">💰</text>
  <text x="320" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#845EC2">お給料</text>
  <!-- Left: work icon -->
  <rect x="50" y="120" width="140" height="110" rx="16" fill="white" stroke="#06D6A0" stroke-width="2.5"/>
  <text x="120" y="162" text-anchor="middle" font-size="36">🤝</text>
  <text x="120" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#06D6A0">役に立つ</text>
  <text x="120" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">誰かを助ける</text>
  <!-- Arrow -->
  <path d="M193,175 L228,175" stroke="#2D2D2D" stroke-width="2.5" fill="none"/>
  <polygon points="226,169 238,175 226,181" fill="#2D2D2D"/>
  <!-- Right: smile icon -->
  <rect x="450" y="120" width="140" height="110" rx="16" fill="white" stroke="#FF6B35" stroke-width="2.5"/>
  <text x="520" y="162" text-anchor="middle" font-size="36">😊</text>
  <text x="520" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FF6B35">笑顔になる</text>
  <text x="520" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">社会がつながる</text>
  <!-- Arrow -->
  <path d="M412,175 L448,175" stroke="#2D2D2D" stroke-width="2.5" fill="none"/>
  <polygon points="446,169 458,175 446,181" fill="#2D2D2D"/>
  <!-- Bottom message -->
  <rect x="100" y="258" width="440" height="44" rx="14" fill="#845EC2"/>
  <text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">お仕事＝お金のため＋誰かを幸せにするため✨</text>
  <text x="320" y="336" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#666">第3話：働くことの意味</text>
</svg>
