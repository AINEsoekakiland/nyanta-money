<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#FFF0E8"/>
  <rect x="0" y="290" width="640" height="70" fill="#A8E6CF"/>
  <!-- Heart and coins -->
  <text x="320" y="140" text-anchor="middle" font-size="72">❤️</text>
  <!-- Arrows -->
  <text x="160" y="170" text-anchor="middle" font-size="32">💰</text>
  <text x="480" y="170" text-anchor="middle" font-size="32">😊</text>
  <path d="M195,160 Q320,120 445,160" stroke="#FF6B35" stroke-width="3" fill="none"/>
  <polygon points="443,154 455,162 443,170" fill="#FF6B35"/>
  <!-- Labels -->
  <rect x="40" y="190" width="160" height="40" rx="12" fill="#FFD166" stroke="#2D2D2D" stroke-width="2"/>
  <text x="120" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2D2D2D">お金を渡す</text>
  <rect x="440" y="190" width="160" height="40" rx="12" fill="#06D6A0" stroke="#2D2D2D" stroke-width="2"/>
  <text x="520" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2D2D2D">ありがとう！</text>
  <!-- Masao speech -->
  <rect x="150" y="240" width="340" height="60" rx="16" fill="white" stroke="#118AB2" stroke-width="3"/>
  <text x="320" y="264" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#118AB2">おこづかいは「ありがとう」が</text>
  <text x="320" y="284" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#118AB2">いっぱい入ってるんだ！✨</text>
  <text x="320" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#666">第1話：お金は「ありがとう」のしるし</text>
</svg>
