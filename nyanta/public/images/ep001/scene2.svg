<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#E8F4FD"/>
  <!-- Background -->
  <rect x="0" y="280" width="640" height="80" fill="#845EC2" opacity="0.2"/>
  <!-- Money coins -->
  <circle cx="200" cy="160" r="45" fill="#FFD166" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="200" cy="160" r="35" fill="#FFB830" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="200" y="167" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2D2D2D">¥</text>
  <circle cx="320" cy="140" r="45" fill="#FFD166" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="320" cy="140" r="35" fill="#FFB830" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="320" y="147" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2D2D2D">¥</text>
  <circle cx="440" cy="160" r="45" fill="#FFD166" stroke="#2D2D2D" stroke-width="3"/>
  <circle cx="440" cy="160" r="35" fill="#FFB830" stroke="#2D2D2D" stroke-width="1.5"/>
  <text x="440" y="167" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2D2D2D">¥</text>
  <!-- Arrows showing exchange -->
  <path d="M100 220 Q200 260 300 220" stroke="#FF6B35" stroke-width="3" fill="none" stroke-dasharray="6,4"/>
  <polygon points="298,215 310,222 298,229" fill="#FF6B35"/>
  <!-- Apple and fish for barter -->
  <text x="80" y="230" font-size="48">🍎</text>
  <text x="530" y="230" font-size="48">🐟</text>
  <text x="310" y="230" font-size="36">→</text>
  <!-- Speech bubble from professor -->
  <rect x="50" y="40" width="540" height="70" rx="16" fill="white" stroke="#845EC2" stroke-width="3"/>
  <text x="320" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2D2D2D">昔は物と物を交換してたんじゃよ！</text>
  <text x="320" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">りんご10個 ＝ 魚1匹 みたいにね 🧐</text>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#666">第1話：物々交換のひみつ</text>
</svg>
